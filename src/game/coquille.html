<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LTW 7 Warnet — prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--fond:#141220;--panneau:#1d1a2b;--bord:#2e2940;--encre:#ece9f4;--doux:#a49cba;
  --or:#f0c451;--vert:#6fc46a;--rouge:#e05a5a;--bois:#b98a54}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
/* dvh : la barre d'adresse mobile mange une partie de 100vh. */
body{height:100dvh}
body{background:var(--fond);color:var(--encre);font-family:"Source Sans 3",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;touch-action:manipulation}
h1,h2,b,button{font-family:Oxanium,system-ui,sans-serif}
#haut{display:flex;align-items:center;gap:11px;padding:7px 9px;background:var(--panneau);
  border-bottom:1px solid var(--bord)}
#reglages{display:none;gap:8px;padding:2px 9px 8px;background:var(--panneau);
  border-bottom:1px solid var(--bord);align-items:flex-end;flex-wrap:wrap}
#reglages label{display:flex;flex-direction:column;gap:2px;font-family:Oxanium,sans-serif;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--doux)}
#reglages input{background:var(--bord);color:var(--encre);border:1px solid #3b3552;
  border-radius:7px;padding:8px;font-size:14px;font-family:Oxanium;font-weight:600;width:74px}
#reglages[data-ouvert="1"]{display:flex}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--doux)}
.stat.or b{color:var(--or)} .stat.vies b{color:var(--rouge)} .stat.bois b{color:var(--bois)}
.stat.rev b{color:var(--vert)}
#jauge{flex:1;min-width:36px;height:6px;background:#000;border-radius:3px;overflow:hidden}
#jaugeRevenu{height:100%;background:var(--vert);width:0}
#haut button{background:var(--bord);color:var(--encre);border:0;border-radius:7px;
  padding:8px 11px;font-size:14px;font-weight:700;cursor:pointer}
#lignes{display:flex;gap:5px;overflow-x:auto;padding:6px 8px;background:#191627;
  border-bottom:1px solid var(--bord)}
.ong{flex:0 0 auto;background:transparent;border:1px solid var(--bord);border-radius:8px;
  padding:5px 9px;color:var(--doux);display:flex;flex-direction:column;line-height:1.15;cursor:pointer}
.ong b{font-size:14px;color:var(--encre)} .ong span{font-size:11.5px}
.ong.actif{border-color:var(--or);background:rgba(240,196,81,.12)}
.ong.mort{opacity:.35;text-decoration:line-through}
#zone{flex:1;position:relative;min-height:0}
/* touch-action:none — sinon le navigateur avale le glisser et le changement
   de ligne au doigt ne part jamais. */
#scene{width:100%;height:100%;display:block;touch-action:none}
#lecture{position:absolute;top:8px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:rgba(20,18,32,.9);border:1px solid var(--or);color:var(--or);
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;font-family:Oxanium}
#bas{background:var(--panneau);border-top:1px solid var(--bord)}
/* Hauteur FIXE : sinon changer de menu redimensionne la zone de jeu, ce qui
   force un recuit du terrain et provoque un a-coup. */
#panneau{height:124px;padding:8px 8px 4px;overflow-y:auto;overscroll-behavior:contain}
.rangee{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.art{flex:0 0 auto;background:var(--bord);border:1px solid #3b3552;border-radius:9px;
  padding:7px 10px;color:var(--encre);display:flex;flex-direction:column;align-items:flex-start;
  line-height:1.2;cursor:pointer;min-width:74px}
.art b{font-size:14px} .art span{font-size:12px;color:var(--doux)}
.art i{font-size:11.5px;color:var(--vert);font-style:normal;font-variant-numeric:tabular-nums;
  display:flex;gap:5px;align-items:center}
.art u{text-decoration:none;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(224,90,90,.22);color:#ef8f8f;border-radius:4px;padding:1px 4px}
.art u.air{background:rgba(127,208,200,.2);color:#8fdcd4}
.art u.sacr{background:rgba(200,120,255,.2);color:#c79cf0}
.art em{font-style:normal;color:var(--doux);font-size:11px;
  background:rgba(255,255,255,.08);border-radius:4px;padding:1px 4px}
.art.verrou{opacity:.45;border-style:dashed;cursor:default}
.art.verrou span{color:var(--or)}
.aide em{font-style:normal;color:var(--encre)}
.art.siege{border-color:#7d4444}
.aide b{color:var(--encre)}
.art.off{opacity:.4} .art.pris{border-color:var(--or);background:rgba(240,196,81,.16)}
.art.acquis{border-color:var(--vert);color:var(--vert)} .art.vente{border-color:#6b3a3a}
.tete{font-family:Oxanium;font-weight:800;font-size:16px;padding:0 2px 6px;display:flex;
  flex-direction:column} .tete span{font-family:"Source Sans 3";font-weight:400;font-size:12.5px;color:var(--doux)}
.aide{margin:5px 2px 0;font-size:12.5px;color:var(--doux);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vide{margin:14px 2px;font-size:14px;color:var(--doux)}
#barre{display:flex;gap:6px;padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
#barre button{flex:1;background:var(--bord);color:var(--encre);border:1px solid #3b3552;
  border-radius:9px;padding:13px 4px;font-size:15px;font-weight:700;cursor:pointer}
#barre button[aria-pressed="true"]{background:var(--or);color:#1a1408;border-color:var(--or)}
select{background:var(--bord);color:var(--encre);border:1px solid #3b3552;border-radius:7px;
  padding:8px;font-size:14px;font-family:Oxanium;font-weight:600}
#fin{position:fixed;inset:0;background:rgba(10,9,16,.88);display:flex;align-items:center;
  justify-content:center;z-index:9;padding:24px;text-align:center}
/* hidden pose display:none, mais display:flex le supplante : il faut le dire. */
#fin[hidden],#lecture[hidden]{display:none}
/* Sous 380 px de large (beaucoup d'Android), la jauge est ce qui saute :
   le chiffre du versement suffit. */
@media (max-width:379px){ #jauge{display:none} .stat b{font-size:16px} }
#fin h2{font-size:30px;margin:0 0 8px} #fin p{color:var(--doux);font-size:14px;margin:0 0 12px}
#fin .cfg{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--doux);
  background:rgba(255,255,255,.06);border-radius:8px;padding:9px 12px;margin:0 0 16px;
  display:inline-block;text-align:left;line-height:1.6}
#fin .cfg b{color:var(--encre);font-family:"IBM Plex Mono",monospace}
#fin .duo{display:flex;gap:8px;justify-content:center}
#fin .duo button:last-child{background:var(--bord);color:var(--encre)}
#fin button{background:var(--or);color:#1a1408;border:0;border-radius:9px;padding:11px 22px;
  font-size:15px;font-weight:800;cursor:pointer}
</style>

<div id="haut">
  <div class="stat or"><b id="or">0</b><span>or</span></div>
  <div class="stat rev"><b id="revenu">+0</b><span>revenu</span></div>
  <div class="stat vies"><b id="vies">0</b><span>vies</span></div>
  <div class="stat bois"><b id="bois">0</b><span>bois</span></div>
  <div class="stat"><b id="minuteur">0 s</b><span>versement</span></div>
  <div id="jauge"><div id="jaugeRevenu"></div></div>
  <button id="vitesse">×1</button>
  <button id="ouvrirReglages" title="Réglages">⚙</button>
</div>
<div id="reglages">
  <label>Joueurs<select id="nbJoueurs">
    <option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option>
  </select></label>
  <label>Bots<select id="difficulte">
    <option value="facile">Débutant</option><option value="normal" selected>Normal</option>
    <option value="agressif">Agressif</option><option value="impitoyable">Impitoyable</option>
  </select></label>
  <label>Rythme<select id="profil">
    <option value="ECLAIR">Éclair</option><option value="BLITZ" selected>Blitz</option>
    <option value="SOUTENU">Soutenu</option><option value="CLASSIQUE">Classique</option>
  </select></label>
  <label>Camp<select id="camp"><option value="0">Humain</option><option value="1">Orc</option>
    <option value="2">Mort-vivant</option><option value="3">Elfe</option></select></label>
  <label>Graine<input id="graine" type="number" min="1" max="999999" value="1"></label>
  <button id="memeGraine" title="Rejouer exactement la même partie">↻ même</button>
  <button id="rejouerHaut">Nouvelle partie</button>
</div>
<div id="lignes"></div>
<div id="zone"><canvas id="scene"></canvas><div id="lecture" hidden>Lecture seule</div></div>
<div id="bas"><div id="panneau"></div>
  <div id="barre">
    <button data-menu="monstres">Monstres</button>
    <button data-menu="batiments" aria-pressed="true">Bâtiments</button>
    <button data-menu="techno">Technologies</button>
  </div></div>
<div id="fin" hidden></div>
<script>
