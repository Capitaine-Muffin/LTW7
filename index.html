<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--fond:#141220;--panneau:#1d1a2b;--bord:#2e2940;--encre:#ece9f4;--doux:#a49cba;
  --or:#f0c451;--vert:#6fc46a;--rouge:#e05a5a;--bois:#b98a54}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--encre);font-family:"Source Sans 3",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;touch-action:manipulation}
h1,h2,b,button{font-family:Oxanium,system-ui,sans-serif}
#haut{display:flex;align-items:center;gap:9px;padding:6px 9px;background:var(--panneau);
  border-bottom:1px solid var(--bord)}
#reglages{display:none;gap:6px;padding:0 9px 7px;background:var(--panneau);
  border-bottom:1px solid var(--bord);align-items:center}
#reglages[data-ouvert="1"]{display:flex}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.stat b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--doux)}
.stat.or b{color:var(--or)} .stat.vies b{color:var(--rouge)} .stat.bois b{color:var(--bois)}
.stat.rev b{color:var(--vert)}
#jauge{flex:1;min-width:70px;height:5px;background:#000;border-radius:3px;overflow:hidden}
#jaugeRevenu{height:100%;background:var(--vert);width:0}
#haut button{background:var(--bord);color:var(--encre);border:0;border-radius:7px;
  padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
#lignes{display:flex;gap:5px;overflow-x:auto;padding:6px 8px;background:#191627;
  border-bottom:1px solid var(--bord)}
.ong{flex:0 0 auto;background:transparent;border:1px solid var(--bord);border-radius:8px;
  padding:5px 9px;color:var(--doux);display:flex;flex-direction:column;line-height:1.15;cursor:pointer}
.ong b{font-size:12px;color:var(--encre)} .ong span{font-size:10px}
.ong.actif{border-color:var(--or);background:rgba(240,196,81,.12)}
.ong.mort{opacity:.35;text-decoration:line-through}
#zone{flex:1;position:relative;min-height:0}
#scene{width:100%;height:100%;display:block}
#lecture{position:absolute;top:8px;left:50%;transform:translateX(-50%);
  background:rgba(20,18,32,.9);border:1px solid var(--or);color:var(--or);
  padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700;font-family:Oxanium}
#bas{background:var(--panneau);border-top:1px solid var(--bord)}
#panneau{min-height:82px;padding:8px 8px 4px}
.rangee{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.art{flex:0 0 auto;background:var(--bord);border:1px solid #3b3552;border-radius:9px;
  padding:7px 10px;color:var(--encre);display:flex;flex-direction:column;align-items:flex-start;
  line-height:1.2;cursor:pointer;min-width:74px}
.art b{font-size:12.5px} .art span{font-size:10.5px;color:var(--doux)}
.art i{font-size:10px;color:var(--vert);font-style:normal;font-variant-numeric:tabular-nums}
.art.off{opacity:.4} .art.pris{border-color:var(--or);background:rgba(240,196,81,.16)}
.art.acquis{border-color:var(--vert);color:var(--vert)} .art.vente{border-color:#6b3a3a}
.tete{font-family:Oxanium;font-weight:800;font-size:14px;padding:0 2px 6px;display:flex;
  flex-direction:column} .tete span{font-family:"Source Sans 3";font-weight:400;font-size:11px;color:var(--doux)}
.aide{margin:5px 2px 0;font-size:11px;color:var(--doux);line-height:1.35}
.vide{margin:14px 2px;font-size:12.5px;color:var(--doux)}
#barre{display:flex;gap:6px;padding:6px 8px 10px}
#barre button{flex:1;background:var(--bord);color:var(--encre);border:1px solid #3b3552;
  border-radius:9px;padding:11px 4px;font-size:13px;font-weight:700;cursor:pointer}
#barre button[aria-pressed="true"]{background:var(--or);color:#1a1408;border-color:var(--or)}
select{background:var(--bord);color:var(--encre);border:1px solid #3b3552;border-radius:7px;
  padding:6px;font-size:12px;font-family:Oxanium;font-weight:600}
#fin{position:fixed;inset:0;background:rgba(10,9,16,.88);display:flex;align-items:center;
  justify-content:center;z-index:9;padding:24px;text-align:center}
/* hidden pose display:none, mais display:flex le supplante : il faut le dire. */
#fin[hidden],#lecture[hidden]{display:none}
#fin h2{font-size:30px;margin:0 0 8px} #fin p{color:var(--doux);font-size:14px;margin:0 0 16px}
#fin button{background:var(--or);color:#1a1408;border:0;border-radius:9px;padding:11px 22px;
  font-size:15px;font-weight:800;cursor:pointer}
</style>

<script>

/* ===== art/sprites.js ===== */
const N=48;
const CAMPS=[
 {k:'humain',role:'Pierre appareillée et bannières',regle:"Symétrie stricte, angles droits, toit en pente franche. Le seul camp entièrement d'aplomb — c'est ce qui le rend lisible au milieu des trois autres.",detail:"Assises de pierre décalées d'un rang sur l'autre, créneaux, meurtrière, bannière sur hampe.",nom:'Humain',
  pal:{d:'#0a0a10',
       a1:'#2f3345',a2:'#454b60',a3:'#646b81',a4:'#8f97ab',a5:'#c2c8d8',
       m1:'#252938',m2:'#3b4155',m3:'#575e73',m4:'#8b93a6',m5:'#b9c0d0',
       b1:'#3f2717',b2:'#5c3a21',b3:'#7d5330',b4:'#a06f42',
       r1:'#1d3a72',r2:'#2c539c',r3:'#4a7ccd',
       t:'#d8ab34',t2:'#96741d',g:'#8fd0ff',g2:'#e0f4ff'}},
 {k:'orc',role:'Rondins bruts et peaux tendues',regle:"Asymétrie assumée : chaque rondin est décalé d'un pixel, le toit déborde de travers. Reconnaissable à ce qui dépasse.",detail:'Troncs verticaux ceinturés de cordages, toit de peau, crâne planté au faîte.',nom:'Orc',
  pal:{d:'#0d0806',
       a1:'#3a2415',a2:'#54331e',a3:'#75492a',a4:'#9a663c',a5:'#c08d58',
       m1:'#231d1a',m2:'#382f28',m3:'#514338',m4:'#78654f',m5:'#a08a70',
       b1:'#3a2415',b2:'#54331e',b3:'#75492a',b4:'#9a663c',
       r1:'#592116',r2:'#853120',r3:'#b2482c',
       t:'#c2a05e',t2:'#7d6432',g:'#ff9038',g2:'#ffd08a'}},
 {k:'mortvivant',role:'Ossements et pierre nécrosée',regle:'Pointes courbes et couronnement irrégulier. Jamais deux dents de la même hauteur, jamais un sommet plat.',detail:"Colonnes d'os, côtes en travers du fût, suintements verts, crâne aux orbites éteintes.",nom:'Mort-vivant',
  pal:{d:'#08060c',
       a1:'#262034',a2:'#39304c',a3:'#524668',a4:'#77688c',a5:'#a396b4',
       m1:'#1e2622',m2:'#2e3b33',m3:'#455546',m4:'#66796a',m5:'#8fa192',
       b1:'#352d24',b2:'#4d4133',b3:'#6b5c48',b4:'#8c7a60',
       r1:'#1b3023',r2:'#2b5035',r3:'#428249',
       t:'#e2dac0',t2:'#a89f84',g:'#7dff86',g2:'#d2ffd0'}},
 {k:'elfe',role:'Bois vivant et clair de lune',regle:'Courbes et dômes. Aucune arête vive — il se reconnaît à sa rondeur avant même sa couleur.',detail:'Troncs tressés en vannerie, veine lumineuse qui remonte le fût, dôme, croissant de lune.',nom:'Elfe de la nuit',
  pal:{d:'#060b0f',
       a1:'#20373f',a2:'#2d4c54',a3:'#3e666c',a4:'#5a8a8c',a5:'#88b5b1',
       m1:'#1c2c33',m2:'#294147',m3:'#3a5b62',m4:'#57838a',m5:'#83aeb0',
       b1:'#2e2f1e',b2:'#43442b',b3:'#5f6140',b4:'#807f57',
       r1:'#372c60',r2:'#4f3e87',r3:'#755cbe',
       t:'#a6e2d2',t2:'#6ba898',g:'#6fe6dd',g2:'#c4fff8'}}
];
const BATS=[
 {k:'barricade',nom:'Barricade',cout:5,role:'Mur jetable. On en pose trente, on les revend.'},
 {k:'fleche',nom:'Flèche',cout:20,role:'Mono-cible. Le socle de toute défense.'},
 {k:'braise',nom:'Braise',cout:35,role:'Zone, courte portée. La réponse aux nuées.'},
 {k:'givre',nom:'Givre',cout:40,role:'Ralentit. Multiplie la valeur du maze.'},
 {k:'foudre',nom:'Foudre',cout:70,role:'Chaîne sur trois cibles.'},
 {k:'mortier',nom:'Mortier',cout:90,role:'Grosse zone, cadence lente, aveugle au contact.'},
 {k:'perce',nom:'Perce-armure',cout:120,role:'Ignore l’armure. Contre les blindés.'},
 {k:'prisme',nom:'Prisme',cout:250,role:'Une seule par joueur. Doit se voir de loin.',anime:true}
];

const G=()=>Array.from({length:N},()=>Array(N).fill(null));
const P=(g,x,y,c)=>{x=Math.round(x);y=Math.round(y);if(c&&x>=0&&x<N&&y>=0&&y<N)g[y][x]=c;};
const R=(g,x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)P(g,x+i,y+j,c);};
function OUT(g,c){const n=g.map(r=>r.slice());
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(g[y][x])continue;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy;
      if(a>=0&&a<N&&b>=0&&b<N&&g[b][a]){n[y][x]=c;break;}}}
  return n;}
/* Chaque piece est dessinee a part, detouree, puis collee : c'est ce qui donne
   les traits noirs INTERIEURS, et c'est toute la difference avec un aplat. */
function couche(base,c,fn){const t=G();fn(t);const o=OUT(t,c);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(o[y][x])base[y][x]=o[y][x];}
function sol(g,p,cx,demi){
  for(let x=-demi;x<=demi;x++){const h=Math.round(2.2*Math.sqrt(Math.max(0,1-(x/demi)**2)));
    for(let j=0;j<h;j++)P(g,cx+x,44+j,p.a1);}}

/* ---- volumes ------------------------------------------------------------- */
function fut(g,x0,y0,long,rayon,pente,p,frettes){
  for(let i=0;i<long;i++){
    const cy=y0+i*pente; let r=rayon,ev=0;
    if(i>=long-3){ev=1;r=rayon+1;} if(i>=long-1)r=rayon+2; if(i<2)r=rayon+1;
    const fr=frettes.some(f=>i>=f&&i<f+2); if(fr)r+=1;
    const n=2*r;
    for(let k=0;k<=n;k++){const t=k/n; let c;
      if(fr)      c=t<0.08?p.m2:t<0.20?p.m4:t<0.32?p.m3:t<0.66?p.m2:p.m1;
      else if(ev) c=t<0.10?p.m3:t<0.22?p.m5:t<0.34?p.m4:t<0.62?p.m3:t<0.82?p.m2:p.m1;
      else        c=t<0.10?p.m3:t<0.24?p.m5:t<0.36?p.m4:t<0.64?p.m2:t<0.84?p.m2:p.m1;
      P(g,x0+i,cy-r+k,c);}
    if(fr)P(g,x0+i,cy-r,p.m1);}
  const bx=x0+long-1,by=Math.round(y0+(long-1)*pente),r=rayon+2;
  for(let k=-r;k<=r;k++)P(g,bx,by+k,p.d);
  R(g,bx-1,by-r+1,1,2*r-1,p.m1);}
function colonne(g,x,y,w,h,p){            // cylindre vertical : meme logique, tournee
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const t=i/(w-1);
    P(g,x+i,y+j, t<0.12?p.m2:t<0.28?p.m4:t<0.42?p.m5:t<0.70?p.m3:t<0.88?p.m2:p.m1);}}
function roue(g,cx,cy,r,p,nr){
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=Math.hypot(x,y);
    if(d>r+.35)continue;
    if(d>r-2.2){const l=(-x-y)/(r*1.3);
      P(g,cx+x,cy+y,l>0.5?p.b4:l>0.05?p.b3:l>-0.5?p.b2:p.b1);}
    else P(g,cx+x,cy+y,p.d);}
  for(let k=0;k<nr;k++){const a=k*Math.PI*2/nr+0.39,ca=Math.cos(a),sa=Math.sin(a);
    for(let d=1.6;d<r-1.9;d+=0.35){const x=ca*d,y=sa*d,l=(-ca-sa);
      P(g,cx+x,cy+y,l>0.4?p.b4:l>-0.3?p.b3:p.b2);
      P(g,cx+x+(Math.abs(ca)>Math.abs(sa)?0:1),cy+y+(Math.abs(ca)>Math.abs(sa)?1:0),l>0.4?p.b3:p.b2);}}
  for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++){const d=Math.hypot(x,y);
    if(d>3.2)continue; P(g,cx+x,cy+y,d<1.3?p.b4:d<2.4?p.b3:p.b1);}}
function planches(g,x,y,w,h,p){
  R(g,x,y,w,h,p.b2); R(g,x,y,w,1,p.b3);
  for(let j=2;j<h;j+=3)R(g,x,y+j,w,1,p.b1);
  R(g,x,y+h-1,w,1,p.b1);
  R(g,x+1,y,2,h,p.m2); R(g,x+w-3,y,2,h,p.m2);
  P(g,x+1,y+1,p.m4); P(g,x+w-3,y+1,p.m4);}
/* ---- materiaux : un jeu par camp ---------------------------------------- */
const ARCHI={
 humain:{ // pierre appareillee
  mat(g,x,y,w,h,p){
    R(g,x,y,w,h,p.a1);
    for(let j=0;j<h;j+=4){const dec=((j/4)|0)%2?3:0;
      for(let i=-dec;i<w;i+=7){
        const bx=x+Math.max(0,i), bw=Math.min(7,w-Math.max(0,i))-1;
        if(bw<1)continue;
        const v=((i*7+j*3)%5);
        R(g,bx,y+j,bw,3,v<1?p.a4:v<4?p.a3:p.a2);
        R(g,bx,y+j,bw,1,v<1?p.a5:p.a4);
        R(g,bx,y+j+2,bw,1,p.a2);}}
    R(g,x,y,1,h,p.a2); R(g,x+w-1,y,1,h,p.a2);},
  crete(g,x,y,w,p){for(let i=0;i<w;i+=6){const bw=Math.min(4,w-i);
    R(g,x+i,y-4,bw,4,p.a3); R(g,x+i,y-4,bw,1,p.a5); R(g,x+i,y-1,bw,1,p.a2);}},
  toit(g,cx,y,w,p){for(let j=0;j<10;j++){const ww=Math.max(2,w-2*(9-j));
    R(g,cx-(ww>>1),y+j,ww,1,j<3?p.r3:j<7?p.r2:p.r1);
    P(g,cx-(ww>>1),y+j,p.r1);P(g,cx+((ww+1)>>1)-1,y+j,p.r1);
    if(j%3===1)P(g,cx-(ww>>1)+1,y+j,p.r3);}
    R(g,cx-(w>>1)-2,y+10,w+4,2,p.a4); R(g,cx-(w>>1)-2,y+11,w+4,1,p.a2);},
  orne(g,cx,y,p){R(g,cx,y-11,1,12,p.t2); P(g,cx,y-12,p.t);
    R(g,cx+1,y-11,6,5,p.r2); R(g,cx+1,y-11,6,1,p.r3);
    P(g,cx+6,y-6,p.r1);P(g,cx+4,y-6,p.r2);P(g,cx+2,y-6,p.r1);}},
 orc:{ // rondins verticaux
  mat(g,x,y,w,h,p){
    for(let i=0;i<w;i+=4){const d=(i%8)?1:0, ww=Math.min(4,w-i);
      R(g,x+i,y+d,ww,h-d,p.a2);
      R(g,x+i+1,y+d,1,h-d,p.a4); P(g,x+i+1,y+d,p.a5);
      R(g,x+i+2,y+d,Math.max(0,ww-2),h-d,p.a3);
      R(g,x+i+ww-1,y+d,1,h-d,p.a1);
      for(let j=y+d+5;j<y+h;j+=9)P(g,x+i+2,j,p.a1);}
    R(g,x-1,y+Math.floor(h*0.28),w+2,1,p.b1);   // cordages
    R(g,x-1,y+Math.floor(h*0.72),w+2,1,p.b1);
    for(let i=0;i<w;i+=6){P(g,x+i,y+Math.floor(h*0.28),p.b3);P(g,x+i+3,y+Math.floor(h*0.72),p.b3);}},
  crete(g,x,y,w,p){for(let i=0;i<w;i+=4){const d=(i%8)?1:0;
    R(g,x+i+1,y-3-d,2,4,p.a3); P(g,x+i+1,y-4-d,p.a4); P(g,x+i+2,y-3-d,p.a5);}},
  toit(g,cx,y,w,p){for(let j=0;j<7;j++){const ww=Math.max(3,w-2*(6-j));
    R(g,cx-(ww>>1)+1,y+3+j,ww,1,j<3?p.r3:p.r1);}
    R(g,cx-(w>>1)-3,y+9,w+5,2,p.r1); R(g,cx-(w>>1)-3,y+9,w+5,1,p.r2);
    for(const[dx,dy]of[[-1,-1],[-2,0],[-3,1],[1,-2],[2,-1],[3,0]])
      P(g,cx+dx*(w>>2),y+9+dy,p.b2);},
  orne(g,cx,y,p){R(g,cx,y-9,2,10,p.b2); P(g,cx,y-9,p.b3);
    R(g,cx-2,y-14,5,4,p.a5); R(g,cx-2,y-10,1,1,p.a5);R(g,cx+2,y-10,1,1,p.a5);
    R(g,cx-1,y-13,1,2,p.d);R(g,cx+1,y-13,1,2,p.d);
    P(g,cx-3,y-12,p.b3);P(g,cx+3,y-12,p.b3);}},
 mortvivant:{ // os et pierre necrosee
  mat(g,x,y,w,h,p){
    R(g,x,y,w,h,p.a1);
    for(let i=1;i<w-1;i+=5){R(g,x+i,y,3,h,p.a3); R(g,x+i,y,1,h,p.a2); P(g,x+i+1,y,p.a4);
      R(g,x+i+2,y,1,h,p.a1);}
    for(let j=y+3;j<y+h;j+=6){R(g,x+1,j,w-2,1,p.t2); R(g,x+1,j-1,w-2,1,p.t);
      P(g,x,j,p.t2);P(g,x+w-1,j,p.t2);}
    for(let j=y+2;j<y+h;j+=11)P(g,x+3+((j*3)%(w-6)),j,p.g);},
  crete(g,x,y,w,p){for(let i=0;i<w;i+=5){const hh=3+((i/5|0)%3);
    R(g,x+i+1,y-hh,2,hh+1,p.t2); R(g,x+i+1,y-hh,1,hh+1,p.t);
    P(g,x+i+1,y-hh-1,p.t);}},
  toit(g,cx,y,w,p){R(g,cx-(w>>1),y+6,w,3,p.r1); R(g,cx-(w>>1)+1,y+6,w-2,1,p.r2);

/* Les monstres. 24 x 24, deux images d'animation, meme methode que les
   batiments : chaque partie est dessinee a part et detouree en noir avant
   d'etre collee, sinon la silhouette s'affaisse en aplat.
   Ils sont vus de face : ils descendent le couloir vers le joueur. */

const NM = 24;
const MG = () => Array.from({length: NM}, () => Array(NM).fill(null));
const MP = (g, x, y, c) => { x = Math.round(x); y = Math.round(y);
  if (c && x >= 0 && x < NM && y >= 0 && y < NM) g[y][x] = c; };
const MR = (g, x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) MP(g, x + i, y + j, c); };
function MOUT(g, c){ const n = g.map(r => r.slice());
  for (let y = 0; y < NM; y++) for (let x = 0; x < NM; x++){ if (g[y][x]) continue;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const a = x + dx, b = y + dy;
      if (a >= 0 && a < NM && b >= 0 && b < NM && g[b][a]){ n[y][x] = c; break; } } }
  return n; }
function MCOUCHE(base, c, fn){ const t = MG(); fn(t); const o = MOUT(t, c);
  for (let y = 0; y < NM; y++) for (let x = 0; x < NM; x++) if (o[y][x]) base[y][x] = o[y][x]; }
/* Corps en trois bandes : ombre a droite, masse au milieu, lumiere a gauche. */
function MCORPS(g, x, y, w, h, p){
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++){
    const t = i / (w - 1);
    MP(g, x + i, y + j, t < 0.18 ? p.c3 : t < 0.62 ? p.c2 : p.c1);
  }
  MR(g, x + 1, y, w - 2, 1, p.c3);
}
function MOMBRE(g, cx, larg, p){
  for (let i = -larg; i <= larg; i++){
    const h = Math.round(1.6 * Math.sqrt(Math.max(0, 1 - (i / larg) ** 2)));
    for (let j = 0; j < h; j++) MP(g, cx + i, 21 + j, p.sol);
  }
}

  /* --- Fantassin : casque a fente, bouclier rond, epee levee --- */
  fantassin(g, f, p){

    MCOUCHE(g, p.d, t => { MCORPS(t, 8, 10, 9, 8, p);                             // tabard
      MR(t, 11, 10, 3, 8, p.t1); MR(t, 11, 10, 1, 8, p.t2);
      MR(t, 8, 10, 9, 1, p.metal); MR(t, 8, 13, 9, 1, p.c3); });
    MCOUCHE(g, p.d, t => { MR(t, 9, 3, 7, 7, p.metal); MR(t, 10, 2, 5, 2, p.metalC);
      MR(t, 10, 6, 5, 2, p.d); MP(t, 11, 6, p.oeil); MP(t, 13, 6, p.oeil);        // fente
      MR(t, 12, 0, 1, 2, p.t1); MP(t, 11, 0, p.t1); });                           // plumet
    MCOUCHE(g, p.d, t => { MR(t, 4, 11, 5, 7, p.metal); MR(t, 5, 12, 3, 5, p.t1); // bouclier
      MR(t, 5, 11, 3, 1, p.metalC); MP(t, 6, 14, p.metalC); });
    MCOUCHE(g, p.d, t => { MR(t, 18, 4 - (f?1:0), 2, 10, p.metalC);               // epee
      MR(t, 18, 3 - (f?1:0), 2, 1, p.metal); MR(t, 17, 13 - (f?1:0), 4, 2, p.t2); });
  },
  /* --- Golem de boue : masse, bras enormes, fissures qui rougeoient --- */
  golem(g, f, p){
    MOMBRE(g, 12, 10, p);
    MCOUCHE(g, p.d, t => { MR(t, 6, 17, 5, 4, p.c1); MR(t, 13, 17, 5, 4, p.c1);
      MR(t, 6, 20, 5, 1, p.d); MR(t, 13, 20, 5, 1, p.d); });
    MCOUCHE(g, p.d, t => { MCORPS(t, 5, 6, 14, 12, p);
      for (const [x, y, w] of [[7,9,3],[13,8,4],[9,14,5],[15,13,2]]){             // bosses
        MR(t, x, y, w, 2, p.c3); MR(t, x, y + 2, w, 1, p.c1); }
      MR(t, 8, 11, 4, 1, p.lueur); MR(t, 13, 15, 3, 1, p.lueur);                  // fissures
      MP(t, 10, 12, p.lueur); MP(t, 14, 16, p.lueur); });
    MCOUCHE(g, p.d, t => {                                                        // bras rattaches
      const ga = 8 + (f?0:1), dr = 8 + (f?1:0);
      MR(t, 2, ga, 6, 9, p.c2); MR(t, 2, ga, 2, 9, p.c3); MR(t, 2, ga + 7, 6, 2, p.c1);
      MR(t, 16, dr, 6, 9, p.c2); MR(t, 16, dr, 2, 9, p.c3); MR(t, 16, dr + 7, 6, 2, p.c1);
      MR(t, 6, ga + 1, 3, 4, p.c2); MR(t, 15, dr + 1, 3, 4, p.c2); });             // epaules
    MCOUCHE(g, p.d, t => { MR(t, 9, 2, 6, 5, p.c2); MR(t, 10, 1, 4, 1, p.c3);     // tete
      MR(t, 10, 4, 2, 2, p.lueur); MR(t, 13, 4, 2, 2, p.lueur); });
  },
  /* --- Ombre : volante, effilochee, pas de sol --- */
  ombre(g, f, p){
    MCOUCHE(g, p.d, t => {
      for (let j = 0; j < 14; j++){ const w = 9 - Math.floor(Math.abs(j - 5) / 2);
        const dec = Math.round(Math.sin((j + (f ? 2 : 0)) / 3) * 1.4);
        MCORPS(t, 12 - (w >> 1) + dec, 4 + j, w, 1, p); }
      for (let i = 0; i < 4; i++) MP(t, 9 + i * 2 + (f?1:0), 18 + (i % 2), p.c1); });
    MCOUCHE(g, p.d, t => { MR(t, 8, 2, 8, 6, p.c1); MR(t, 9, 1, 6, 2, p.c2);      // capuche
      MR(t, 9, 4, 6, 4, p.d);
      MR(t, 10, 5, 2, 2, p.lueur); MR(t, 13, 5, 2, 2, p.lueur);
      MP(t, 10, 5, p.lueurC); MP(t, 14, 5, p.lueurC); });
    MCOUCHE(g, p.d, t => { MR(t, 3, 8 + (f?1:0), 5, 2, p.c2); MP(t, 2, 9 + (f?1:0), p.c1);
      MR(t, 16, 8 + (f?0:1), 5, 2, p.c2); MP(t, 21, 9 + (f?0:1), p.c1); });       // bras
  },
  /* --- Troll : voute, defenses, gourdin --- */
  troll(g, f, p){
    MOMBRE(g, 12, 9, p);
    MCOUCHE(g, p.d, t => { MR(t, 7 - (f?1:0), 16, 4, 5, p.c1); MR(t, 13 + (f?0:1), 16, 4, 5, p.c1);
      MR(t, 7 - (f?1:0), 20, 4, 1, p.d); MR(t, 13 + (f?0:1), 20, 4, 1, p.d); });
    MCOUCHE(g, p.d, t => { MCORPS(t, 6, 7, 12, 10, p);
      MR(t, 8, 10, 8, 1, p.c1); MR(t, 8, 13, 8, 1, p.c1);                         // cotes
      MR(t, 7, 7, 10, 1, p.c3); });
    MCOUCHE(g, p.d, t => { MR(t, 2, 8 + (f?1:0), 4, 8, p.c2); MR(t, 2, 8 + (f?1:0), 2, 8, p.c3);
      MR(t, 18, 6 + (f?0:1), 4, 8, p.c2); MR(t, 18, 6 + (f?0:1), 2, 8, p.c3); });
    MCOUCHE(g, p.d, t => { MR(t, 8, 2, 8, 6, p.c2); MR(t, 9, 1, 6, 1, p.c3);      // tete
      MR(t, 9, 4, 2, 2, p.oeil); MR(t, 13, 4, 2, 2, p.oeil);
      MP(t, 9, 4, p.lueur); MP(t, 14, 4, p.lueur);
      MR(t, 9, 7, 6, 1, p.d);
      MP(t, 9, 6, p.os); MP(t, 9, 5, p.os); MP(t, 14, 6, p.os); MP(t, 14, 5, p.os); }); // defenses
    MCOUCHE(g, p.d, t => { MR(t, 19, 1 + (f?0:1), 4, 6, p.bois);                  // gourdin
      MR(t, 20, 6 + (f?0:1), 2, 8, p.bois2); MP(t, 19, 2 + (f?0:1), p.c3); });
  },
  /* --- Banshee : volante, voile en lambeaux, bras ouverts --- */
  banshee(g, f, p){
    MCOUCHE(g, p.d, t => {
      for (let j = 0; j < 15; j++){ const w = 10 - Math.floor(Math.abs(j - 4) / 1.7);
        const dec = Math.round(Math.sin((j + (f ? 3 : 0)) / 3.5) * 1.8);
        MCORPS(t, 12 - (w >> 1) + dec, 4 + j, Math.max(2, w), 1, p); }
      for (let i = 0; i < 5; i++) MP(t, 8 + i * 2, 18 + ((i + (f?1:0)) % 3), p.c1); });
    MCOUCHE(g, p.d, t => { MR(t, 9, 2, 6, 6, p.c2); MR(t, 10, 1, 4, 1, p.c3);     // visage
      MR(t, 10, 4, 4, 3, p.d);
      MR(t, 10, 4, 2, 2, p.lueurC); MR(t, 13, 4, 2, 2, p.lueurC);
      MP(t, 12, 7, p.lueur);                                                       // bouche
      MP(t, 8, 1, p.c1); MP(t, 15, 1, p.c1); MP(t, 7, 3, p.c1); MP(t, 16, 3, p.c1); });
    MCOUCHE(g, p.d, t => { MR(t, 2, 7 + (f?1:0), 6, 2, p.c2); MP(t, 1, 8 + (f?1:0), p.lueur);
      MR(t, 16, 7 + (f?0:1), 6, 2, p.c2); MP(t, 22, 8 + (f?0:1), p.lueur);
      MP(t, 3, 9 + (f?1:0), p.c1); MP(t, 20, 9 + (f?0:1), p.c1); });              // bras
  }
};

/* ===== src/engine/rng.js ===== */
/* Aleatoire seme. Jamais Math.random() : un replay doit redonner la meme partie. */
function creerRng(graine){
  let e = (graine >>> 0) || 0x2545F491;
  return {
    get etat(){ return e; },
    set etat(v){ e = v >>> 0; },
    /* xorshift32 : court, deterministe, suffisant pour du gameplay. */
    suivant(){ e ^= e << 13; e >>>= 0; e ^= e >>> 17; e ^= e << 5; e >>>= 0; return e; },
    entre(min, max){ return min + (this.suivant() % (max - min + 1)); }
  };
}

/* ===== src/engine/grille.js ===== */
/* La grille et le chemin. Une seule fonction de recherche : ce qui change entre
   un monstre et le Controleur, c'est le prix d'une case occupee.
     - monstre     : occupee = infranchissable, il contourne ou il attend
     - Controleur  : occupee = prix de sa demolition, il passe par le plus faible */

const IDX = (c, x, y) => y * c.LARGEUR + x;
const XY  = (c, i) => ({x: i % c.LARGEUR, y: (i / c.LARGEUR) | 0});

/* Voisins dans un ordre FIXE. Toute la reproductibilite des replays en depend :
   deux chemins de cout egal doivent toujours donner le meme resultat. */
const VOISINS = [[0,-1],[1,0],[0,1],[-1,0]];

function calculerChemin(cfg, occupe, coutOccupe){
  const n = cfg.LARGEUR * cfg.HAUTEUR;
  const dep = IDX(cfg, cfg.entree.x, cfg.entree.y);
  const arr = IDX(cfg, cfg.exit.x, cfg.exit.y);
  const g = new Int32Array(n).fill(0x7fffffff);
  const prec = new Int32Array(n).fill(-1);
  const vu = new Uint8Array(n);
  g[dep] = 0;
  /* File de priorite : tableau trie par (f, index). Sur 117 cases c'est plus
     rapide qu'un tas, et l'ordre est totalement determine. */
  const file = [dep];
  const h = i => { const p = XY(cfg, i);
    return Math.abs(p.x - cfg.exit.x) + Math.abs(p.y - cfg.exit.y); };

  while (file.length){
    let meilleur = 0;
    for (let k = 1; k < file.length; k++){
      const a = file[k], b = file[meilleur];
      const fa = g[a] + h(a), fb = g[b] + h(b);
      if (fa < fb || (fa === fb && a < b)) meilleur = k;
    }
    const cur = file.splice(meilleur, 1)[0];
    if (cur === arr) break;
    if (vu[cur]) continue;
    vu[cur] = 1;
    const p = XY(cfg, cur);
    for (const [dx, dy] of VOISINS){
      const x = p.x + dx, y = p.y + dy;
      if (x < 0 || y < 0 || x >= cfg.LARGEUR || y >= cfg.HAUTEUR) continue;
      const j = IDX(cfg, x, y);
      let pas = 10;
      if (occupe[j] >= 0){
        if (coutOccupe === null) continue;          // le monstre ne traverse pas
        pas = 10 + coutOccupe(j);
      }
      const nouveau = g[cur] + pas;
      if (nouveau < g[j]){ g[j] = nouveau; prec[j] = cur; file.push(j); }
    }
  }
  if (g[arr] === 0x7fffffff) return null;           // aucune route, meme en cassant
  const chemin = [];
  for (let i = arr; i !== -1; i = prec[i]) chemin.push(i);
  return chemin.reverse();
}

/* Y a-t-il encore une route libre ? Sert a savoir si la ligne est scellee. */
function routeLibre(cfg, occupe){ return calculerChemin(cfg, occupe, null) !== null; }


/* ===== src/engine/moteur.js ===== */
/* Le moteur. Pur : aucun DOM, aucun reseau, aucune horloge systeme.
   On avance par avancer(), 100 ms de jeu par appel. Une partie est entierement
   decrite par {graine, profil, entrees[]} — c'est ce qui donne l'anti-triche
   serveur et le PvP asynchrone avec le meme code. */

let _id = 0;
const nouvelId = () => ++_id;

function creerLigne(cfg, prof, i, estJoueur){
  return {
    i, estJoueur, nom: estJoueur ? 'Toi' : 'Bot ' + i,
    or: prof.or, revenu: prof.revenu, vies: prof.vies, bois: prof.bois,
    branches: {}, batiments: [], monstres: [],
    occupe: new Int32Array(cfg.LARGEUR * cfg.HAUTEUR).fill(-1),
    chemin: null, scellee: false, mort: false,
    prochainBot: 60 + i * 17          // decale les bots pour qu'ils ne jouent pas a l'unisson
  };
}

function creerPartie({graine = 12345, profil = 'BLITZ', joueurs = 4, cfg = CONFIG} = {}){
  _id = 0;
  const prof = cfg.PROFILS[profil];
  const etat = {
    cfg, prof, pas: 0, rng: creerRng(graine), graine, profil,
    lignes: [], moi: 0, fini: false, vainqueur: null, journal: [],
    controleur: null, prochainControleur: cfg.controleur.periode
  };
  for (let i = 0; i < joueurs; i++) etat.lignes.push(creerLigne(cfg, prof, i, i === 0));
  etat.lignes.forEach(l => recalculerChemin(etat, l));
  return etat;
}

/* Le voisin a qui on envoie : le suivant encore en vie, en cercle. */
function voisin(etat, i){
  const n = etat.lignes.length;
  for (let k = 1; k <= n; k++){
    const j = (i + k) % n;
    if (!etat.lignes[j].mort) return j;
  }
  return i;
}

function recalculerChemin(etat, l){
  l.chemin = calculerChemin(etat.cfg, l.occupe, null);
  l.scellee = l.chemin === null;
}

/* ---- actions du joueur --------------------------------------------------- */
function poserBatiment(etat, l, type, x, y){
  const cfg = etat.cfg, def = cfg.TOURS[type];
  const i = y * cfg.LARGEUR + x;
  if (!def || l.occupe[i] >= 0 || l.or < def.or) return false;
  if (x === cfg.entree.x && y === cfg.entree.y) return false;
  if (x === cfg.exit.x && y === cfg.exit.y) return false;
  l.or -= def.or;
  const b = {id: nouvelId(), type, x, y, pv: def.pv, pvMax: def.pv, recharge: 0};
  l.batiments.push(b);
  l.occupe[i] = b.id;
  recalculerChemin(etat, l);
  return true;
}
function ameliorer(etat, l, b, vers){
  const cfg = etat.cfg, def = cfg.TOURS[vers];
  if (!def) return false;
  if (def.branche && !l.branches[def.branche]) return false;
  if (l.or < def.or) return false;
  l.or -= def.or;
  b.type = vers; b.pvMax = def.pv; b.pv = def.pv; b.recharge = 0;
  return true;
}
function vendre(etat, l, b){
  const def = etat.cfg.TOURS[b.type];
  l.or += Math.floor(def.or * etat.cfg.remboursement / 100);
  retirerBatiment(etat, l, b);
  return true;
}
function retirerBatiment(etat, l, b){
  l.occupe[b.y * etat.cfg.LARGEUR + b.x] = -1;
  l.batiments.splice(l.batiments.indexOf(b), 1);
  recalculerChemin(etat, l);
}
function envoyer(etat, l, type){
  const def = etat.cfg.MONSTRES[type];
  if (!def || l.or < def.or) return false;
  const cible = etat.lignes[voisin(etat, l.i)];
  if (cible === l) return false;
  if (cible.monstres.length >= etat.cfg.maxVivants) return false;
  l.or -= def.or;
  l.revenu += def.revenu;                       // definitif : c'est tout le jeu
  faireApparaitre(etat, cible, type, l.i);
  return true;
}
function acheterBranche(etat, l, cle){
  if (l.branches[cle] || l.bois < 1) return false;
  l.bois -= 1; l.branches[cle] = true; return true;
}

function faireApparaitre(etat, ligne, type, proprietaire){
  const cfg = etat.cfg, def = cfg.MONSTRES[type];
  ligne.monstres.push({
    id: nouvelId(), type, proprietaire, pv: def.pv, pvMax: def.pv,
    x: cfg.entree.x * cfg.MILLI + cfg.MILLI / 2,
    y: cfg.entree.y * cfg.MILLI + cfg.MILLI / 2,
    etape: 0, lent: 0, etourdi: 0, poison: 0, poisonReste: 0
  });
}

/* ---- un pas de simulation ------------------------------------------------ */
function avancer(etat){
  const cfg = etat.cfg;
  etat.pas++;
  if (etat.pas % etat.prof.tickRevenu === 0)
    for (const l of etat.lignes) if (!l.mort) l.or += l.revenu;

  for (const l of etat.lignes) if (!l.mort){ deplacerMonstres(etat, l); tirer(etat, l); }
  bots(etat);
  controleur(etat);

  const vivants = etat.lignes.filter(l => !l.mort);
  if (vivants.length <= 1 && !etat.fini){
    etat.fini = true;
    etat.vainqueur = vivants[0] ? vivants[0].i : null;
  }
  return etat;
}

function deplacerMonstres(etat, l){
  const cfg = etat.cfg;
  for (let k = l.monstres.length - 1; k >= 0; k--){
    const m = l.monstres[k], def = cfg.MONSTRES[m.type];
    if (m.poisonReste > 0){ m.poisonReste--; if (etat.pas % 10 === 0) m.pv -= m.poison; }
    if (m.pv <= 0){ l.monstres.splice(k, 1); continue; }
    if (m.etourdi > 0){ m.etourdi--; continue; }
    let v = def.v;
    if (m.lent > 0){ m.lent--; v = Math.round(v * (100 - 40) / 100); }

    if (def.vol){                                   // les volants ignorent le maze
      const cy = cfg.exit.y * cfg.MILLI + cfg.MILLI / 2;
      const cx = cfg.exit.x * cfg.MILLI + cfg.MILLI / 2;
      const dx = cx - m.x, dy = cy - m.y;
      const d = Math.max(1, Math.round(Math.sqrt(dx * dx + dy * dy)));
      m.x += Math.round(dx * v / d); m.y += Math.round(dy * v / d);
      if (d <= v){ sortie(etat, l, m, k); }
      continue;
    }
    if (!l.chemin){ continue; }                     // ligne scellee : il attend
    const suiv = l.chemin[Math.min(m.etape + 1, l.chemin.length - 1)];
    const sx = (suiv % cfg.LARGEUR) * cfg.MILLI + cfg.MILLI / 2;
    const sy = ((suiv / cfg.LARGEUR) | 0) * cfg.MILLI + cfg.MILLI / 2;
    const dx = sx - m.x, dy = sy - m.y;
    const d = Math.abs(dx) + Math.abs(dy);
    if (d <= v){
      m.x = sx; m.y = sy; m.etape++;
      if (m.etape >= l.chemin.length - 1){ sortie(etat, l, m, k); }
    } else {
      m.x += Math.round(dx * v / d); m.y += Math.round(dy * v / d);
    }
  }
}

/* Un monstre qui sort vole une vie ET repart sur la ligne suivante. */
function sortie(etat, l, m, k){
  const envoyeur = etat.lignes[m.proprietaire];
  l.monstres.splice(k, 1);
  if (l.vies > 0){
    l.vies -= 1;
    if (envoyeur && !envoyeur.mort) envoyeur.vies += 1;
    etat.journal.push({pas: etat.pas, type: 'vol', de: l.i, vers: m.proprietaire});
  }
  if (l.vies <= 0 && !l.mort){
    l.mort = true; l.monstres = [];
    if (envoyeur && !envoyeur.mort) envoyeur.bois += etat.cfg.boisParKill;
    etat.journal.push({pas: etat.pas, type: 'mort', ligne: l.i, par: m.proprietaire});
    return;
  }
  const suivante = etat.lignes[voisin(etat, l.i)];
  if (suivante && suivante !== l && !suivante.mort &&
      suivante.monstres.length < etat.cfg.maxVivants && m.pv > 0){
    m.etape = 0;
    m.x = etat.cfg.entree.x * etat.cfg.MILLI + etat.cfg.MILLI / 2;
    m.y = etat.cfg.entree.y * etat.cfg.MILLI + etat.cfg.MILLI / 2;
    suivante.monstres.push(m);
  }
}

function tirer(etat, l){
  const cfg = etat.cfg;
  for (const b of l.batiments){
    const def = cfg.TOURS[b.type];
    if (!def.deg && !def.degPct && !def.teleporte) continue;
    if (b.recharge > 0){ b.recharge--; continue; }
    const bx = b.x * cfg.MILLI + cfg.MILLI / 2, by = b.y * cfg.MILLI + cfg.MILLI / 2;
    let cible = null, meilleure = -1;
    for (const m of l.monstres){                    // le plus avance d'abord
      const dx = m.x - bx, dy = m.y - by;
      if (dx * dx + dy * dy > def.p * def.p) continue;
      if (m.etape > meilleure){ meilleure = m.etape; cible = m; }
    }
    if (!cible) continue;
    b.recharge = def.c;
    if (def.teleporte){ cible.etape = 0;
      cible.x = cfg.entree.x * cfg.MILLI + cfg.MILLI / 2;
      cible.y = cfg.entree.y * cfg.MILLI + cfg.MILLI / 2; continue; }
    const touches = def.zone
      ? l.monstres.filter(m => {const dx = m.x - cible.x, dy = m.y - cible.y;
          return dx * dx + dy * dy <= def.zone * def.zone;})
      : [cible];
    for (const m of touches){
      m.pv -= def.degPct ? Math.ceil(m.pv * def.degPct / 100) : def.deg;
      if (def.ralentit) m.lent = 20;
      if (def.etourdit) m.etourdi = def.etourdit;
      if (def.poison){ m.poison = def.poison; m.poisonReste = 40; }
    }
    l.monstres = l.monstres.filter(m => m.pv > 0);
    if (def.usageUnique) retirerBatiment(etat, l, b);
  }
}

/* Bots : deterministes, pas d'IA. Ils mazent en serpentin et envoient
   regulierement le meilleur monstre qu'ils peuvent payer. */
const PLAN_BOT = [];
for (let y = 2; y <= 10; y += 2)
  for (let x = 0; x < 9; x++) PLAN_BOT.push({x, y: y, sauter: (y / 2) % 2 ? x === 8 : x === 0});
function bots(etat){
  const cfg = etat.cfg;
  for (const l of etat.lignes){
    if (l.estJoueur || l.mort) continue;
    if (l.or >= 30 && etat.pas % 7 === 0){
      const place = PLAN_BOT.filter(p => !p.sauter)[l.batiments.length];
      if (place && l.occupe[place.y * cfg.LARGEUR + place.x] < 0)
        poserBatiment(etat, l, l.batiments.length % 3 === 0 ? 'epine' : 'guet', place.x, place.y);
    }
    if (etat.pas >= l.prochainBot){
      /* Le seul aleatoire du moteur, et il passe par le RNG seme : sans lui,
         toutes les parties d'un meme profil seraient identiques. */
      l.prochainBot = etat.pas + etat.rng.entre(70, 130);
      const abordables = Object.keys(cfg.MONSTRES)
        .filter(k => cfg.MONSTRES[k].or <= l.or)
        .sort((a, b) => cfg.MONSTRES[b].or - cfg.MONSTRES[a].or);
      if (abordables.length){
        /* Le plus cher la plupart du temps, sinon le suivant : un bot qui joue
           toujours pareil se lit en une partie. */
        const choix = (abordables.length > 1 && etat.rng.entre(0, 3) === 0) ? 1 : 0;
        envoyer(etat, l, abordables[choix]);
      }
    }
  }
}

/* Le Controleur : une seule unite, invulnerable, qui traverse les lignes et
   demolit ce qui scelle le passage. Il ne vole aucune vie. */
function controleur(etat){
  const cfg = etat.cfg;
  if (!etat.controleur){
    if (etat.pas < etat.prochainControleur) return;
    const scellee = etat.lignes.find(l => !l.mort && l.scellee);
    if (!scellee) { etat.prochainControleur = etat.pas + 50; return; }
    etat.controleur = {ligne: scellee.i, x: cfg.entree.x * cfg.MILLI + cfg.MILLI / 2,
      y: cfg.entree.y * cfg.MILLI + cfg.MILLI / 2, etape: 0, chemin: null};
  }
  const c = etat.controleur, l = etat.lignes[c.ligne];
  if (l.mort){ etat.controleur = null; etat.prochainControleur = etat.pas + cfg.controleur.periode; return; }
  if (!c.chemin || c.chemin.length === 0)
    c.chemin = calculerChemin(cfg, l.occupe, i => {
      const b = l.batiments.find(b => b.id === l.occupe[i]);
      return b ? Math.round(b.pv / 20) : 0;
    });
  if (!c.chemin){ etat.controleur = null; return; }

  const cible = c.chemin[Math.min(c.etape + 1, c.chemin.length - 1)];
  const occupant = l.occupe[cible];
  if (occupant >= 0){                                // il vaporise, il ne perce pas
    const cx = (cible % cfg.LARGEUR) * cfg.MILLI + cfg.MILLI / 2;
    const cy = ((cible / cfg.LARGEUR) | 0) * cfg.MILLI + cfg.MILLI / 2;
    for (const b of [...l.batiments]){
      const bx = b.x * cfg.MILLI + cfg.MILLI / 2, by = b.y * cfg.MILLI + cfg.MILLI / 2;
      const dx = bx - cx, dy = by - cy;
      if (dx * dx + dy * dy <= cfg.controleur.zone * cfg.controleur.zone){
        b.pv -= cfg.controleur.deg;
        if (b.pv <= 0) retirerBatiment(etat, l, b);
      }
    }
    etat.journal.push({pas: etat.pas, type: 'controleur', ligne: l.i});
    c.chemin = null;
    return;
  }
  const sx = (cible % cfg.LARGEUR) * cfg.MILLI + cfg.MILLI / 2;
  const sy = ((cible / cfg.LARGEUR) | 0) * cfg.MILLI + cfg.MILLI / 2;
  const dx = sx - c.x, dy = sy - c.y, d = Math.abs(dx) + Math.abs(dy);
  const v = cfg.controleur.v;
  if (d <= v){ c.x = sx; c.y = sy; c.etape++;
    if (c.etape >= c.chemin.length - 1){
      etat.controleur = null; etat.prochainControleur = etat.pas + cfg.controleur.periode; }
  } else { c.x += Math.round(dx * v / d); c.y += Math.round(dy * v / d); }
}


/* ===== src/game/jeu.js ===== */
/* Rendu et entrees. Tout ce qui touche au DOM vit ici — le moteur, lui, n'en
   sait rien. */

const SPRITE = {                    // quelle planche de sprite pour quelle tour
  guet:'fleche', pitie:'fleche', socle:'fleche', elementaire:'fleche',
  epine:'perce', sang:'perce', lame:'perce', broyeur:'perce',
  canon:'mortier',
  barbecue:'braise', puits:'braise', boom:'braise', meteore:'braise',
  glacier:'givre', eauBenite:'givre', eauUltime:'givre', glaceUltime:'givre',
  courtCircuit:'foudre', canonElec:'foudre', generateur:'foudre', condensateur:'foudre',
  cloaque:'prisme', damne:'prisme', fosse:'prisme', mort:'prisme',
  oiseau:'prisme', lanterne:'prisme', champignon:'prisme', teleporteur:'prisme'
};
/* Chaque monstre a deux images ; on alterne pour la marche. */

let etat, camp, cache = {}, enMain = null, selection = null, ligneVue = 0,
    menu = null, acceleration = 1, dernier = 0, accum = 0;

/* ---- pre-rendu des sprites ---------------------------------------------- */
function preparerSprites(){
  for (const cle of Object.keys(MONSTRES_ART)) for (const im of [0, 1]){
    const g = dessinerMonstre(cle, im);
    const cv = document.createElement('canvas');
    cv.width = NM; cv.height = NM;
    const c = cv.getContext('2d');
    for (let y = 0; y < NM; y++) for (let x = 0; x < NM; x++){
      const v = g[y][x]; if (!v) continue; c.fillStyle = v; c.fillRect(x, y, 1, 1);
    }
    cache['m:' + cle + ':' + im] = cv;
  }
  for (const b of BATS) for (const f of CAMPS){
    const g = dessiner(b.k, f, false);
    const cv = document.createElement('canvas');
    cv.width = N; cv.height = N;
    const c = cv.getContext('2d');
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
      const v = g[y][x]; if (!v) continue;
      c.fillStyle = v; c.fillRect(x, y, 1, 1);
    }
    cache[b.k + ':' + f.k] = cv;
  }
}

/* ---- dessin -------------------------------------------------------------- */
function dessinerJeu(){
  const cv = document.getElementById('scene'), c = cv.getContext('2d');
  const cfg = etat.cfg, l = etat.lignes[ligneVue];
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const larg = cv.clientWidth, haut = cv.clientHeight;
  if (cv.width !== larg * dpr){ cv.width = larg * dpr; cv.height = haut * dpr; }
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.imageSmoothingEnabled = false;

  const T = Math.floor(Math.min(larg / cfg.LARGEUR, haut / cfg.HAUTEUR));
  const ox = Math.floor((larg - T * cfg.LARGEUR) / 2);
  const oy = Math.floor((haut - T * cfg.HAUTEUR) / 2);
  c.clearRect(0, 0, larg, haut);

  c.fillStyle = '#4a7c42'; c.fillRect(ox, oy, T * cfg.LARGEUR, T * cfg.HAUTEUR);
  c.strokeStyle = 'rgba(0,0,0,.13)'; c.lineWidth = 1;
  for (let x = 0; x <= cfg.LARGEUR; x++){ c.beginPath();
    c.moveTo(ox + x * T + .5, oy); c.lineTo(ox + x * T + .5, oy + T * cfg.HAUTEUR); c.stroke(); }
  for (let y = 0; y <= cfg.HAUTEUR; y++){ c.beginPath();
    c.moveTo(ox, oy + y * T + .5); c.lineTo(ox + T * cfg.LARGEUR, oy + y * T + .5); c.stroke(); }

  c.fillStyle = 'rgba(255,255,255,.18)';
  c.fillRect(ox + cfg.entree.x * T, oy + cfg.entree.y * T, T, T);
  c.fillStyle = 'rgba(220,60,60,.30)';
  c.fillRect(ox + cfg.exit.x * T, oy + cfg.exit.y * T, T, T);

  if (l.chemin){                                    // le trajet, en clair
    c.fillStyle = 'rgba(255,255,255,.13)';
    for (const i of l.chemin){
      const x = i % cfg.LARGEUR, y = (i / cfg.LARGEUR) | 0;
      c.fillRect(ox + x * T + T * .3, oy + y * T + T * .3, T * .4, T * .4);
    }
  } else {
    c.fillStyle = 'rgba(230,70,60,.22)'; c.fillRect(ox, oy, T * cfg.LARGEUR, T * cfg.HAUTEUR);
  }

  const tailleSprite = Math.round(T * 1.35);
  for (const b of [...l.batiments].sort((a, z) => a.y - z.y)){
    const img = cache[(SPRITE[b.type] || 'fleche') + ':' + camp.k];
    const px = ox + b.x * T + (T - tailleSprite) / 2;
    const py = oy + (b.y + 1) * T - tailleSprite * 0.92;
    c.drawImage(img, px, py, tailleSprite, tailleSprite);
    if (b.pv < b.pvMax){
      c.fillStyle = '#000'; c.fillRect(ox + b.x * T + 3, oy + b.y * T + 2, T - 6, 3);
      c.fillStyle = '#6de06d';
      c.fillRect(ox + b.x * T + 3, oy + b.y * T + 2, (T - 6) * b.pv / b.pvMax, 3);
    }
    if (selection === b){
      c.strokeStyle = '#ffd24a'; c.lineWidth = 2;
      c.strokeRect(ox + b.x * T + 1, oy + b.y * T + 1, T - 2, T - 2);
      const def = cfg.TOURS[b.type];
      if (def.p){ c.strokeStyle = 'rgba(255,210,74,.35)'; c.beginPath();
        c.arc(ox + (b.x + .5) * T, oy + (b.y + .5) * T, def.p * T / cfg.MILLI, 0, 7); c.stroke(); }
    }
  }

  const taille = Math.round(T * 0.95);
  for (const m of [...l.monstres].sort((a, z) => a.y - z.y)){
    const x = ox + m.x * T / cfg.MILLI, y = oy + m.y * T / cfg.MILLI;
    const def = cfg.MONSTRES[m.type];
    /* Les volants planent : on les remonte et on les fait osciller. */
    const vol = def.vol ? -taille * 0.30 + Math.sin((etat.pas + m.id * 7) / 6) * taille * 0.06 : 0;
    const im = cache['m:' + m.type + ':' + (((etat.pas / 3) | 0) % 2)];
    if (def.vol){                                   // ombre portee au sol, detachee
      c.fillStyle = 'rgba(0,0,0,.28)';
      c.beginPath(); c.ellipse(x, y + taille * .16, taille * .26, taille * .10, 0, 0, 7); c.fill();
    }
    if (im) c.drawImage(im, Math.round(x - taille / 2), Math.round(y - taille * .62 + vol), taille, taille);
    if (m.pv < m.pvMax){
      const w = taille * .6;
      c.fillStyle = '#000';    c.fillRect(x - w / 2, y - taille * .70 + vol, w, 3);
      c.fillStyle = '#e05a5a'; c.fillRect(x - w / 2, y - taille * .70 + vol, w * m.pv / m.pvMax, 3);
    }
  }

  if (etat.controleur && etat.controleur.ligne === ligneVue){
    const k = etat.controleur;
    const x = ox + k.x * T / cfg.MILLI, y = oy + k.y * T / cfg.MILLI, r = T * .34;
    c.fillStyle = '#ffcf3a'; c.fillRect(x - r, y - r, r * 2, r * 2);
    c.fillStyle = '#0d0b10'; c.fillRect(x - r, y - r, r * 2, 2); c.fillRect(x - r, y + r - 2, r * 2, 2);
    c.fillRect(x - r, y - r, 2, r * 2); c.fillRect(x + r - 2, y - r, 2, r * 2);
    c.fillRect(x - r * .5, y - r * .3, r, r * .25);
  }

  if (enMain){                                      // apercu de pose
    const p = survol;
    if (p && p.x >= 0){
      const libre = l.occupe[p.y * cfg.LARGEUR + p.x] < 0 &&
        !(p.x === cfg.entree.x && p.y === cfg.entree.y) &&
        !(p.x === cfg.exit.x && p.y === cfg.exit.y);
      c.fillStyle = libre ? 'rgba(255,255,255,.35)' : 'rgba(230,70,60,.5)';
      c.fillRect(ox + p.x * T, oy + p.y * T, T, T);
    }
  }
  return {T, ox, oy};
}
let survol = null, geo = {T:1, ox:0, oy:0};

/* ---- bandeaux ------------------------------------------------------------ */
function majBandeau(){
  const l = etat.lignes[etat.moi], cfg = etat.cfg;
  const reste = etat.prof.tickRevenu - (etat.pas % etat.prof.tickRevenu);
  document.getElementById('or').textContent = l.or.toLocaleString('fr');
  document.getElementById('revenu').textContent = '+' + l.revenu;
  document.getElementById('vies').textContent = l.vies;
  document.getElementById('bois').textContent = l.bois;
  document.getElementById('minuteur').textContent = (reste / 10).toFixed(1) + ' s';
  document.getElementById('jaugeRevenu').style.width =
    (100 - reste * 100 / etat.prof.tickRevenu) + '%';

  const onglets = document.getElementById('lignes');
  onglets.innerHTML = etat.lignes.map((x, i) =>
    `<button class="ong ${i === ligneVue ? 'actif' : ''} ${x.mort ? 'mort' : ''}" data-ligne="${i}">
      <b>${i === etat.moi ? 'Toi' : 'Bot ' + i}</b><span>♥ ${x.vies} · +${x.revenu}</span></button>`).join('');
  document.getElementById('lecture').hidden = (ligneVue === etat.moi);
}

function panneau(){
  const d = document.getElementById('panneau');
  const l = etat.lignes[etat.moi], cfg = etat.cfg;
  if (ligneVue !== etat.moi){ d.innerHTML =
    `<p class="vide">Ligne de ${etat.lignes[ligneVue].nom} — lecture seule. Reviens sur la tienne pour jouer.</p>`; return; }
  if (selection){
    const def = cfg.TOURS[selection.type];
    const vers = (def.vers || []).flatMap(v => v === 'ELEM'
      ? Object.keys(cfg.TOURS).filter(k => cfg.TOURS[k].branche)
      : [v]);
    d.innerHTML = `<div class="tete">${def.nom}
        <span>${def.deg ? def.deg + ' dég.' : def.degPct ? def.degPct + ' % PV' : 'aucun dégât'} ·
        portée ${(def.p / cfg.MILLI).toFixed(1)} · ${(600 / def.c).toFixed(0)}/min</span></div>
      <div class="rangee">` +
      vers.map(v => { const t = cfg.TOURS[v];
        const bloque = t.branche && !l.branches[t.branche];
        const cher = l.or < t.or;
        return `<button class="art ${bloque || cher ? 'off' : ''}" data-up="${v}">
          <b>${t.nom}</b><span>${bloque ? '🔒 ' + cfg.BRANCHES[t.branche].nom : t.or + ' or'}</span></button>`;
      }).join('') +
      `<button class="art vente" data-vendre="1"><b>Vendre</b><span>+${Math.floor(def.or * cfg.remboursement / 100)} or</span></button>
      </div>`;
    return;
  }
  if (menu === 'batiments'){
    d.innerHTML = `<div class="rangee">` + cfg.boutique.map(k => { const t = cfg.TOURS[k];
      return `<button class="art ${l.or < t.or ? 'off' : ''} ${enMain === k ? 'pris' : ''}" data-poser="${k}">
        <b>${t.nom}</b><span>${t.or} or</span></button>`; }).join('') +
      `</div><p class="aide">Un appui pour prendre, un appui sur la grille pour poser. L'or n'est débité qu'à la pose.</p>`;
  } else if (menu === 'monstres'){
    d.innerHTML = `<div class="rangee">` + Object.keys(cfg.MONSTRES).map(k => { const m = cfg.MONSTRES[k];
      return `<button class="art ${l.or < m.or ? 'off' : ''}" data-envoyer="${k}">
        <b>${m.nom}</b><span>${m.or} or → +${m.revenu}</span><i>${(m.revenu / m.or).toFixed(3)}</i></button>`; }).join('') +
      `</div><p class="aide">Le chiffre du bas est le revenu par pièce d'or. Les petits monstres rapportent le plus, mais ne percent pas.</p>`;
  } else if (menu === 'techno'){
    d.innerHTML = `<div class="rangee">` + Object.keys(cfg.BRANCHES).map(k => { const b = cfg.BRANCHES[k];
      const pris = l.branches[k];
      return `<button class="art ${pris ? 'acquis' : (l.bois < 1 ? 'off' : '')}" data-branche="${k}">
        <b>${b.nom}</b><span>${pris ? 'acquise' : '1 bois'}</span></button>`; }).join('') +
      `</div><p class="aide">3 bois au départ, +1 par joueur éliminé. Une branche débloque sa tour élémentaire — qui, elle, est gratuite.</p>`;
  } else d.innerHTML = '';
}

/* ---- boucle -------------------------------------------------------------- */
function boucle(t){
  requestAnimationFrame(boucle);
  if (!dernier) dernier = t;
  let dt = Math.min(250, t - dernier); dernier = t;
  if (!etat.fini){
    accum += dt * acceleration;
    let garde = 0;
    while (accum >= etat.cfg.PAS_MS && garde++ < 40){ avancer(etat); accum -= etat.cfg.PAS_MS; }
  }
  geo = dessinerJeu();
  majBandeau();
  if (etat.fini) finir();
}
function finir(){
  const d = document.getElementById('fin');
  if (!d.hidden) return;
  d.hidden = false;
  const gagne = etat.vainqueur === etat.moi;
  d.innerHTML = `<div><h2>${gagne ? 'Gagné' : 'Éliminé'}</h2>
    <p>${gagne ? 'Dernier debout.' : 'Le dernier debout est ' + (etat.lignes[etat.vainqueur] || {nom:'personne'}).nom + '.'}
    Revenu final : +${etat.lignes[etat.moi].revenu} · ${Math.floor(etat.pas / 10)} s de partie.</p>
    <button id="rejouer">Rejouer</button></div>`;
  document.getElementById('rejouer').onclick = () => demarrer();
}

/* ---- entrees ------------------------------------------------------------- */
function caseSous(ev){
  const cv = document.getElementById('scene'), r = cv.getBoundingClientRect();
  const px = (ev.clientX ?? ev.touches[0].clientX) - r.left;
  const py = (ev.clientY ?? ev.touches[0].clientY) - r.top;
  const x = Math.floor((px - geo.ox) / geo.T), y = Math.floor((py - geo.oy) / geo.T);
  if (x < 0 || y < 0 || x >= etat.cfg.LARGEUR || y >= etat.cfg.HAUTEUR) return null;
  return {x, y};
}
function brancher(){
  const cv = document.getElementById('scene');
  cv.addEventListener('pointermove', e => { survol = caseSous(e); });
  cv.addEventListener('pointerleave', () => { survol = null; });
  cv.addEventListener('pointerdown', e => {
    const p = caseSous(e); survol = p;
    if (!p || ligneVue !== etat.moi) return;
    const l = etat.lignes[etat.moi];
    if (enMain){
      if (poserBatiment(etat, l, enMain, p.x, p.y)){
        if (l.or < etat.cfg.TOURS[enMain].or) enMain = null;   // plus les moyens : on lache
      }
      panneau(); return;
    }
    const id = l.occupe[p.y * etat.cfg.LARGEUR + p.x];
    selection = id >= 0 ? l.batiments.find(b => b.id === id) : null;
    if (selection) menu = null;
    panneau();
  });

  document.getElementById('barre').addEventListener('click', e => {
    const b = e.target.closest('[data-menu]'); if (!b) return;
    const m = b.dataset.menu;
    menu = (menu === m) ? null : m;
    selection = null; if (menu !== 'batiments') enMain = null;
    document.querySelectorAll('[data-menu]').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.menu === menu)));
    panneau();
  });
  document.getElementById('panneau').addEventListener('click', e => {
    const l = etat.lignes[etat.moi];
    const p = e.target.closest('[data-poser]');
    if (p){ enMain = (enMain === p.dataset.poser) ? null : p.dataset.poser; panneau(); return; }
    const v = e.target.closest('[data-envoyer]');
    if (v){ envoyer(etat, l, v.dataset.envoyer); panneau(); return; }
    const t = e.target.closest('[data-branche]');
    if (t){ acheterBranche(etat, l, t.dataset.branche); panneau(); return; }
    const u = e.target.closest('[data-up]');
    if (u && selection){ ameliorer(etat, l, selection, u.dataset.up); panneau(); return; }
    if (e.target.closest('[data-vendre]') && selection){
      vendre(etat, l, selection); selection = null; panneau(); }
  });
  document.getElementById('lignes').addEventListener('click', e => {
    const b = e.target.closest('[data-ligne]'); if (!b) return;
    ligneVue = +b.dataset.ligne; selection = null; enMain = null; panneau();
  });
  document.getElementById('vitesse').addEventListener('click', e => {
    acceleration = acceleration === 1 ? 2 : acceleration === 2 ? 4 : 1;
    e.currentTarget.textContent = '×' + acceleration;
  });
}

function demarrer(){
  const joueurs = +document.getElementById('nbJoueurs').value;
  const profil = document.getElementById('profil').value;
  etat = creerPartie({graine: (Date.now() & 0x7fffffff), profil, joueurs});
  ligneVue = etat.moi; selection = null; enMain = null; menu = 'batiments'; acceleration = 1;
  document.querySelectorAll('[data-menu]').forEach(x =>
    x.setAttribute('aria-pressed', String(x.dataset.menu === 'batiments')));
  document.getElementById('fin').hidden = true;
  document.getElementById('vitesse').textContent = '×1';
  panneau();
}

window.addEventListener('DOMContentLoaded', () => {
  camp = CAMPS[0];
  preparerSprites();
  brancher();
  document.getElementById('rejouerHaut').onclick = () => {
    document.getElementById('reglages').dataset.ouvert = '0'; demarrer(); };
  document.getElementById('ouvrirReglages').onclick = () => {
    const r = document.getElementById('reglages');
    r.dataset.ouvert = r.dataset.ouvert === '1' ? '0' : '1'; };
  document.getElementById('camp').onchange = e => { camp = CAMPS[+e.target.value]; };
  demarrer();
  requestAnimationFrame(boucle);
});

</script>
